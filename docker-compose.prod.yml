version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=tcmanager
      - POSTGRES_PASSWORD=tcmanager_secure_password_change_me
      - POSTGRES_DB=tc_manager
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # TC Manager Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://tcmanager:tcmanager_secure_password_change_me@postgres:5432/tc_manager
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123
      - RMTO_COMPANY_CODE=58
      - RMTO_USERNAME=NOGSH
      - RMTO_PASSWORD=CHANGE_ME_HERE
      - SEND_INTERVAL_MINUTES=15
      - DEVICE_API_KEY=${DEVICE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local
